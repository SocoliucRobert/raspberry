# Configurație broker MQTT Mosquitto

# Ascultă pentru conexiuni MQTT standard
listener 1883
protocol mqtt

# Ascultă pentru WebSocket (opțional)
listener 9001
protocol websockets

# Permite conexiuni anonime (DOAR pentru dezvoltare/rețea locală).
# În producție, configurează autentificare cu password_file.
allow_anonymous true

# Persistență
persistence true
persistence_location /mosquitto/data/

# Logare
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
